<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXERCICIO 11</title>
</head>

<body>
    <div id="container">
        <button id="alertaBtn">clique aqui</button>
        <input type="text" id="textInput" placeholder="digite algo">
        <div id="hoverDiv">passe o mouse</div>
        <select id="selectColor">
            <option value="">escolha uma cor</option>
            <option value="blue">azul</option>
            <option value="green">verde</option>
            <option value="red">vermelho</option>
        </select>
    </div>
    <script>
        const alertaBtn = document.getElementById("alertaBtn");
        alertaBtn.addEventListener("click", () => {
            alert("O botão foi clicado!");
        });
        const textInput = document.getElementById("textInput");
        textInput.addEventListener("keydown", (event) => {
            console.log("tecla pressionada:", event.key);
        });
        textInput.addEventListener("focus", () => {
            textInput.style.backgroundColor = "yellow";
        });
        textInput.addEventListener("blur", () => {
            textInput.style.backgroundColor = "";
        });
        const hoverDiv = document.getElementById("hoverDiv");
        hoverDiv.addEventListener("mouseover", () => {
            hoverDiv.style.backgroundColor = "lightblue";
        });
        hoverDiv.addEventListener("mouseout", () => {
            hoverDiv.style.backgroundColor = "";
        });
        const selectColor = document.getElementById("selectColor");
        selectColor.addEventListener("change", () => {
            document.body.style.backgroundColor = selectColor.value;
        });

    </script>
</body>

</html>
